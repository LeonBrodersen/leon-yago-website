<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Vorlage für das Teilen-Bild</title>
<!-- Quelle von og-image.jpg, im Stil der Startseite „Bühne“: die große Zeile
     mit dem Fenster darin. Neu erzeugen: diese Seite bei 1200 x 630 px mit
     doppelter Pixeldichte aufnehmen und auf 1200 x 630 herunterrechnen. Sie ist
     absichtlich nicht verlinkt und steht auf noindex. -->
<style>
  @font-face { font-family: "Inter"; src: url("/fonts/inter-v20-latin-regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Inter"; src: url("/fonts/inter-v20-latin-500.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Inter"; src: url("/fonts/inter-v20-latin-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Inter Display"; src: url("/fonts/inter-display-latin-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F6F7F4; color: #141A17;
    font: 400 20px/1.45 "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 44px 60px 46px;
  }
  .kopf { display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; font-weight: 700; letter-spacing: -0.035em; }
  .kopf span { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; color: #4A544F; }
  h1 {
    font-family: "Inter Display", "Inter", system-ui, sans-serif;
    display: grid; grid-template-columns: auto auto 1fr; align-items: center; column-gap: 0.14em;
    font-size: 158px; font-weight: 700; line-height: 0.9; letter-spacing: -0.048em;
  }
  h1 .z2 { grid-column: 1 / -1; justify-self: end; }
  .pille { position: relative; width: 2.3em; height: 0.7em; margin-top: 0.04em; border-radius: 0.07em; overflow: hidden; background: #141A17; }
  .pille::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(20, 26, 23, 0.16); }
  .pille img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
  .fuss { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; padding-top: 18px; border-top: 1px solid rgba(20, 26, 23, 0.14); }
  .wer { display: flex; align-items: flex-end; gap: 16px; }
  .wer img { width: 64px; height: auto; display: block; margin-bottom: -4px; }
  .wer p { color: #4A544F; font-size: 18px; }
  .wer b { color: #141A17; font-weight: 500; }
  .adresse { color: #047857; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
</style>
</head>
<body>
  <p class="kopf">ly&#8209;webstudio <span>Websites, auch Apps</span></p>
  <h1><span>Ich baue</span><span class="pille"><img src="/assets/img/pille-zahnarzt-geraete.webp" alt=""></span><span class="z2">Websites.</span></h1>
  <div class="fuss">
    <div class="wer">
      <img src="/assets/img/leon-frei-320.webp" width="320" height="400" alt="">
      <p><b>Leon Brodersen</b><br>Festpreis, fertig in ein bis zwei Wochen, Erstgespräch kostenlos</p>
    </div>
    <p class="adresse">ly&#8209;webstudio.de</p>
  </div>
</body>
</html>
